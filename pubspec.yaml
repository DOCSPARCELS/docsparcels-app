name: docsparcels_app
description: "Doc's & Parcels - app per i clienti (iPhone e Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Chiamate al gestionale (my.docsparcels.com)
  http: ^1.2.2
  # Chiave dell'app nel portachiavi del telefono (Keychain su iPhone, Keystore su Android)
  flutter_secure_storage: ^9.2.2
  local_auth: ^3.0.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  local_auth_android: ^2.3.0
  local_auth_darwin: ^2.0.5
  # Pagina di pagamento myPOS dentro l'app (nota 367)
  webview_flutter: ^4.10.0
  # Documenti della spedizione: scaricati con la chiave e aperti col visualizzatore del telefono (nota 368)
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  # Etichetta al mittente con la condivisione del telefono (WhatsApp e altre app, nota 368 V3)
  share_plus: ^10.1.4
  # Foto del profilo dalla galleria o dalla fotocamera (nota 372)
  image_picker: ^1.1.2
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  material_symbols_icons: ^4.2960.0
  app_badge_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Schermata di avvio nativa (nota 373 V3): si rigenera con «dart run flutter_native_splash:create»
  flutter_native_splash: ^2.4.4

# Avvio tutto bianco con il logo (scelta B di Luca). Da Android 12 il sistema mostra solo
# un'icona rotonda al centro: li' c'e' il globo.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/immagini/logo_avvio.png
  android_12:
    color: "#FFFFFF"
    image: assets/immagini/globo_avvio_android12.png
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  # Logo di Doc's & Parcels (schermata di avvio, accesso, testata)
  assets:
    - assets/immagini/
  # Carattere dell'app: Raleway (nota 373 V2), dentro l'app, si vede anche senza rete.
  # Il sito resta con Montserrat. Licenza libera: assets/font/OFL-Raleway.txt
  fonts:
    - family: Raleway
      fonts:
        - asset: assets/font/Raleway-Regular.ttf
          weight: 400
        - asset: assets/font/Raleway-Medium.ttf
          weight: 500
        - asset: assets/font/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/font/Raleway-Bold.ttf
          weight: 700
