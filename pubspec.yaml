name: docsparcels_app
description: "Doc's & Parcels - app per i clienti (iPhone e Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Chiamate al gestionale (my.docsparcels.com)
  http: ^1.2.2
  # Chiave dell'app nel portachiavi del telefono (Keychain su iPhone, Keystore su Android)
  flutter_secure_storage: ^9.2.2
  # Font del gestionale: Montserrat
  google_fonts: ^6.2.1
  local_auth: ^3.0.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  local_auth_android: ^2.3.0
  local_auth_darwin: ^2.0.5
  # Pagina di pagamento myPOS dentro l'app (nota 367)
  webview_flutter: ^4.10.0
  # Documenti della spedizione: scaricati con la chiave e aperti col visualizzatore del telefono (nota 368)
  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
